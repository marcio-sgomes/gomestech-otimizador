name: Gerar APK

# Toda vez que o código muda na branch main, gera um APK novo assinado
# e publica como Release. O app lê esse Release para mostrar o botão "Atualizar".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o secret KEYSTORE_BASE64. Veja docs/ASSINATURA.md (sem a chave fixa, a atualização dentro do app não funciona)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otimizador.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/otimizador.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease -PupdateRepo=${{ github.repository }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GomesTech-Otimizador.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: GomesTech-Otimizador.apk
          make_latest: true
