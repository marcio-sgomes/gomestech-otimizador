name: Gerar APK

# Toda mudança na branch main passa por 3 etapas:
#   1) Testes da lógica (cobertura 100%), verificação de segurança e lint
#   2) Robô de vistoria + teste de estresse em emuladores Android 7, 8, 10, 12 e 15
#   3) Só se tudo passar: gera o APK assinado e publica como Release
#      (o app lê esse Release para mostrar o botão "Atualizar").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes da lógica e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verificação de segurança do código
        run: |
          # O app nunca pode usar comandos de root, apagar dados de outros apps
          # ou pedir permissões que mexem no sistema.
          if grep -rnE 'Runtime\.getRuntime\(\)\.exec|ProcessBuilder|"su"|MANAGE_EXTERNAL_STORAGE|WRITE_SECURE_SETTINGS|WRITE_SETTINGS|killBackgroundProcesses|DevicePolicyManager|deleteApplicationCacheFiles|clearApplicationUserData' app/src/main; then
            echo "::error::Código proibido encontrado (veja acima)."
            exit 1
          fi
          echo "OK: nenhum código perigoso."

      - name: Testes da lógica + cobertura + lint
        run: gradle :app:testDebugUnitTest :app:createDebugUnitTestCoverageReport :app:lintDebug --no-daemon --stacktrace

      - name: Conferir cobertura de 100%
        run: python3 scripts/verificar_cobertura.py app/build/reports/coverage/test/debug/report.xml

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-logica
          path: |
            app/build/reports/tests/
            app/build/reports/coverage/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  vistoria:
    name: Robô de vistoria (Android ${{ matrix.nome }})
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            nome: "7"
          - api: 26
            nome: "8"
          - api: 29
            nome: "10"
          - api: 31
            nome: "12"
          - api: 35
            nome: "15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Habilitar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar app e testes
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # "bash" na frente: funciona mesmo se o arquivo perder a permissão de execução no git (commit pelo Windows).
          script: bash ./scripts/e2e.sh

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-vistoria-android-${{ matrix.nome }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            resultados/
          if-no-files-found: ignore

  apk:
    name: Gerar e publicar APK
    needs: [testes, vistoria]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otimizador.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/otimizador.jks" >> "$GITHUB_ENV"
            echo "VERSAO_TESTE=false" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o secret KEYSTORE_BASE64: APK de teste. Veja docs/ASSINATURA.md."
            echo "VERSAO_TESTE=true" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease -PupdateRepo=${{ github.repository }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GomesTech-Otimizador.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ env.VERSAO_TESTE == 'true' && format('Versão de teste 1.0.{0}', github.run_number) || format('Versão 1.0.{0}', github.run_number) }}
          body: |
            ${{ github.event.head_commit.message || 'Nova versão' }}

            Aprovada nos testes automáticos: lógica (100% de cobertura), segurança, e robô de vistoria + estresse nos Android 7, 8, 10, 12 e 15.
          files: GomesTech-Otimizador.apk
          prerelease: ${{ env.VERSAO_TESTE == 'true' }}
          make_latest: ${{ env.VERSAO_TESTE == 'true' && 'false' || 'true' }}
