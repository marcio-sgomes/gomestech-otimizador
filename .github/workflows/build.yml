name: Gerar APK

# Toda vez que o código muda na branch main, gera um APK novo
# e publica como Release. O app lê esse Release para mostrar o botão "Atualizar".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O Android SDK já vem instalado no ubuntu-latest (ANDROID_HOME).
      # O Gradle baixa sozinho a plataforma que faltar.
      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otimizador.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/otimizador.jks" >> "$GITHUB_ENV"
            echo "VERSAO_TESTE=false" >> "$GITHUB_ENV"
          else
            # Sem a chave oficial: gera uma versão de teste (assinatura provisória).
            # Ela não aparece como "última versão" para a atualização interna.
            echo "::warning::Sem o secret KEYSTORE_BASE64: APK de teste. Veja docs/ASSINATURA.md."
            echo "VERSAO_TESTE=true" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease -PupdateRepo=${{ github.repository }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GomesTech-Otimizador.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ env.VERSAO_TESTE == 'true' && format('Versão de teste 1.0.{0}', github.run_number) || format('Versão 1.0.{0}', github.run_number) }}
          body: ${{ github.event.head_commit.message }}
          files: GomesTech-Otimizador.apk
          prerelease: ${{ env.VERSAO_TESTE == 'true' }}
          make_latest: ${{ env.VERSAO_TESTE == 'true' && 'false' || 'true' }}
